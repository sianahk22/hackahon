<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_10 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_10" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_10');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || 450;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xf2fcf5, 0.0035);

const camera = new THREE.PerspectiveCamera(40, width / height, 1, 1000);
camera.position.set(130, 110, 150);
camera.lookAt(0, 10, 0);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xfffaed, 1.4);
dirLight.position.set(90, 140, 60);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 1024;
dirLight.shadow.mapSize.height = 1024;
scene.add(dirLight);

const hemiLight = new THREE.HemisphereLight(0xe8f5e9, 0xd0e8db, 0.6);
scene.add(hemiLight);

// Group for city
const cityGroup = new THREE.Group();
scene.add(cityGroup);

// Ground Plane (Soft warm eco grass/canvas)
const groundGeo = new THREE.PlaneGeometry(320, 320, 24, 24);
const groundMat = new THREE.MeshLambertMaterial({ color: 0xebf5ee });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
cityGroup.add(ground);

// Grid lines subtle
const gridHelper = new THREE.GridHelper(260, 26, 0x1b382b, 0xd5e5db);
gridHelper.position.y = 0.1;
cityGroup.add(gridHelper);

// Buildings materials
const matEco = new THREE.MeshStandardMaterial({ color: 0x1b382b, roughness: 0.3 }); // Mairie / Central
const matSolar = new THREE.MeshStandardMaterial({ color: 0x22c55e, roughness: 0.2 }); // Green eco-roofs
const matNeutral = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 }); // Public buildings
const matWood = new THREE.MeshStandardMaterial({ color: 0xe2d7c5, roughness: 0.8 }); // School / Warm
const matGlass = new THREE.MeshStandardMaterial({ color: 0x93c5fd, roughness: 0.1, transparent: true, opacity: 0.85 });

// Key Districts & Buildings
const buildingsData = [
  // Center: Hôtel de Ville & Pôle Civique
  { x: 0, z: -10, w: 32, d: 24, h: 22, color: matEco, name: 'Hôtel de Ville' },
  { x: 0, z: -10, w: 20, d: 14, h: 32, color: matNeutral },
  // Solar canopy roof
  { x: 0, z: -10, w: 34, d: 26, h: 1.5, y: 33, color: matSolar },

  // Écoles & Pôle Enfance (East)
  { x: 50, z: -30, w: 28, d: 18, h: 14, color: matWood, name: 'Groupe Scolaire' },
  { x: 50, z: -8, w: 16, d: 16, h: 10, color: matNeutral },
  { x: 50, z: -30, w: 26, d: 16, h: 1.2, y: 15, color: matSolar },

  // Complexe Sportif & Gymnase (West)
  { x: -55, z: -20, w: 36, d: 26, h: 16, color: matNeutral, name: 'Complexe Sportif' },
  { x: -55, z: -20, w: 34, d: 24, h: 1.2, y: 17, color: matSolar },

  // Médiathèque & Espace Culturel (South)
  { x: -25, z: 40, w: 24, d: 20, h: 18, color: matNeutral, name: 'Médiathèque' },
  { x: -25, z: 40, w: 22, d: 18, h: 1.5, y: 19, color: matSolar },

  // Centre Technique & Décarbonation Flotte Municipale (South-East)
  { x: 45, z: 45, w: 30, d: 22, h: 12, color: matEco, name: 'Flotte Véhicules Propres' },
  { x: 45, z: 45, w: 28, d: 20, h: 1.2, y: 13, color: matSolar },

  // Habitations & Éco-quartier périphérique
  { x: -60, z: 35, w: 16, d: 14, h: 20, color: matWood },
  { x: -60, z: 55, w: 18, d: 16, h: 24, color: matNeutral },
  { x: 10, z: 65, w: 22, d: 16, h: 16, color: matWood },
  { x: 80, z: 15, w: 18, d: 18, h: 18, color: matNeutral },
  { x: -20, z: -60, w: 24, d: 18, h: 16, color: matWood },
  { x: 25, z: -65, w: 20, d: 20, h: 22, color: matNeutral },
];

buildingsData.forEach(b => {
  const geo = new THREE.BoxGeometry(b.w, b.h, b.d);
  const mesh = new THREE.Mesh(geo, b.color);
  mesh.position.set(b.x, (b.y !== undefined ? b.y : b.h / 2), b.z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  cityGroup.add(mesh);
});

// Add Energy Nodes / Pulses (Solar production & battery nodes)
const pulseGeo = new THREE.CylinderGeometry(0.8, 0.8, 25, 16);
const pulseMat = new THREE.MeshBasicMaterial({ color: 0x10b981, transparent: true, opacity: 0.65 });

const nodes = [
  { x: 0, z: -10, y: 35 },
  { x: 50, z: -30, y: 18 },
  { x: -55, z: -20, y: 20 },
  { x: -25, z: 40, y: 22 },
  { x: 45, z: 45, y: 16 }
];

const beaconSpheres = [];
nodes.forEach(n => {
  const beam = new THREE.Mesh(pulseGeo, pulseMat);
  beam.position.set(n.x, n.y + 12.5, n.z);
  cityGroup.add(beam);

  const sphereGeo = new THREE.SphereGeometry(2.4, 16, 16);
  const sphereMat = new THREE.MeshBasicMaterial({ color: 0x34d399 });
  const sphere = new THREE.Mesh(sphereGeo, sphereMat);
  sphere.position.set(n.x, n.y + 25, n.z);
  cityGroup.add(sphere);
  beaconSpheres.push(sphere);
});

// Subtle glowing energy rings on the ground
const ringGeo = new THREE.RingGeometry(8, 10, 32);
const ringMat = new THREE.MeshBasicMaterial({ color: 0x10b981, side: THREE.DoubleSide, transparent: true, opacity: 0.35 });
nodes.forEach(n => {
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = -Math.PI / 2;
  ring.position.set(n.x, 0.2, n.z);
  cityGroup.add(ring);
});

// Trees & Urban green spaces
const trunkGeo = new THREE.CylinderGeometry(0.4, 0.6, 3, 8);
const trunkMat = new THREE.MeshLambertMaterial({ color: 0x8d6e63 });
const foliageGeo = new THREE.SphereGeometry(2.5, 8, 8);
const foliageMat = new THREE.MeshLambertMaterial({ color: 0x2e7d32 });

for (let i = 0; i < 45; i++) {
  const tx = (Math.random() - 0.5) * 220;
  const tz = (Math.random() - 0.5) * 220;
  if (Math.hypot(tx, tz + 10) > 30) {
    const tree = new THREE.Group();
    const trunk = new THREE.Mesh(trunkGeo, trunkMat);
    trunk.position.y = 1.5;
    const foliage = new THREE.Mesh(foliageGeo, foliageMat);
    foliage.position.y = 4;
    foliage.scale.y = 1.3;
    tree.add(trunk);
    tree.add(foliage);
    tree.position.set(tx, 0, tz);
    cityGroup.add(tree);
  }
}

// Interactive Rotation & Auto Orbit
let isDragging = false;
let prevX = 0;
let prevY = 0;
let targetRotationY = 0;
let targetRotationX = 0;

container.addEventListener('pointerdown', (e) => {
  isDragging = true;
  prevX = e.clientX;
  prevY = e.clientY;
});

window.addEventListener('pointerup', () => {
  isDragging = false;
});

window.addEventListener('pointermove', (e) => {
  if (!isDragging) return;
  const dx = e.clientX - prevX;
  const dy = e.clientY - prevY;
  targetRotationY += dx * 0.006;
  targetRotationX = Math.max(-0.25, Math.min(0.35, targetRotationX + dy * 0.003));
  prevX = e.clientX;
  prevY = e.clientY;
});

// Animation Loop
let clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const time = clock.getElapsedTime();
  
  if (!isDragging) {
    cityGroup.rotation.y += 0.0022;
  } else {
    cityGroup.rotation.y += (targetRotationY - cityGroup.rotation.y) * 0.1;
    cityGroup.rotation.x += (targetRotationX - cityGroup.rotation.x) * 0.1;
  }

  // Animate glowing nodes
  beaconSpheres.forEach((s, idx) => {
    s.position.y += Math.sin(time * 3 + idx) * 0.04;
    s.scale.setScalar(1 + Math.sin(time * 2 + idx) * 0.15);
  });

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  const w = container.clientWidth || window.innerWidth;
  const h = container.clientHeight || 450;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_10 -->
</body>
</html>
